# Run the Student Management API with:   docker compose up -d --build
# Then open http://localhost:8000/docs   and stop with:   docker compose down
services:
  student-api:
    build: .
    image: ${DOCKERUSERNAME:-local}/student-management-api:latest
    container_name: student-api
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: "1.0.0"
      DATABASE_PATH: /app/data/students.db
    volumes:
      - student-data:/app/data        # students survive container restarts
    restart: unless-stopped

volumes:
  student-data:
